; BIT Mark 1 firmware — Waveshare ESP32-S3-Touch-LCD-1.85 (SKU 28514).
;
; `platform = espressif32@53.3.11` (from the project's earlier notes)
; does not exist in PlatformIO's official registry — verified directly
; with `pio pkg search espressif32`, which shows only
; `platformio/espressif32` at 7.1.3 (as of 2026-09-18). Pinned to that
; real, current version instead. If `pio run` pulls in a Arduino-ESP32
; core version that breaks something pinned below (LVGL/display-panel
; libs were chosen for Arduino-ESP32 3.1.1), report the actual resolved
; framework version back before changing the other pins to match — don't
; guess at compatibility.
;
; Developed against PlatformIO Core 6.2.0.
;
; 2026-09-28/29: ESP32_Display_Panel and ESP32_IO_Expander went through
; three real, verified fixes in a row (wrong registry owner, then a
; missing ESP_Panel_Conf.h, then that config needing our exact panel/bus
; set up) before hitting a real wall: neither bit_display.cpp nor
; bit_touch.cpp actually calls into either library yet (both are
; documented stubs — see their own TODOs), and this library's config
; only supports LCD_NAME in {ST7262, ST7789, GC9503, GC9A01} — not our
; real ST77916 QSPI panel at all. Rather than compile a library nothing
; uses yet against config values that would be fabricated (a fake LCD
; chip, SPI pins standing in for a real 4-line QSPI bus), both libraries
; and esp-lib-utils are removed from lib_deps below until
; bit_display.cpp/bit_touch.cpp are actually wired up to real hardware
; APIs — add them back then, verified against whatever version actually
; supports ST77916/the real board wiring at that time.

[env:waveshare-esp32s3-touch-lcd-185]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16MB flash, 8MB Octal PSRAM built into the chip package.
; qio_opi is the standard memory_type for the R8 (Octal PSRAM) variant —
; cross-check against Waveshare's own example project before first flash
; if boot/PSRAM behaves unexpectedly on real hardware.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; lv_conf.h lives in firmware/include/ (on PlatformIO's include path by
; default), so no LV_CONF_* build flag is needed for LVGL to find it.
build_flags =
    -DBOARD_HAS_PSRAM
    ; Real `pio run` on real hardware (2026-09-28): our own .cpp files
    ; found firmware/include/lv_conf.h fine via PlatformIO's normal
    ; include path, but LVGL's own internal .c files use a hardcoded
    ; relative path (lv_conf_internal.h's "../../lv_conf.h" fallback)
    ; that doesn't land on it given where PlatformIO actually installs
    ; the lvgl library. LV_CONF_INCLUDE_SIMPLE switches that fallback to
    ; a plain #include "lv_conf.h", resolved the same normal way our own
    ; files already use successfully -- documented LVGL/PlatformIO
    ; behavior, not a guess.
    -DLV_CONF_INCLUDE_SIMPLE

monitor_speed = 115200
; Real board test (2026-09-29): the board uses native USB-Serial/JTAG
; (confirmed by esptool's own "USB mode: USB-Serial/JTAG" output during
; upload), not a separate USB-UART chip. Opening `pio device monitor`
; was toggling DTR/RTS the way a real auto-reset circuit would, causing
; a continuous reset loop (repeating ROM bootloader lines, no app
; output ever printed) instead of a single clean reset into the app.
; monitor_rts/monitor_dtr = 0 is the documented fix for ESP32-S3 native
; USB-CDC boards -- stops the monitor itself from driving those lines.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

lib_deps =
    links2004/WebSockets @ 2.7.3
    lvgl/lvgl @ 8.4.0
    ; ESP32_Display_Panel / ESP32_IO_Expander / esp-lib-utils deliberately
    ; NOT listed here — see this file's header comment. bit_display.cpp
    ; and bit_touch.cpp don't call into them yet; add them back once that
    ; real hardware wiring actually happens, verified against a version
    ; that supports our real ST77916 panel.
    ; Motion (bit_motion.cpp) needs a PCA9685 servo driver library, but
    ; this sandbox has no registry access to verify a real current
    ; version the way espressif32@7.1.3 was confirmed above (do NOT
    ; guess a version — that's exactly how the wrong espressif32@53.3.11
    ; pin happened). Before wiring bit_motion.cpp's PCA9685 calls for
    ; real, run `pio pkg search "Adafruit PWM Servo Driver"` from an
    ; environment with registry access (e.g. Codespaces) and add the
    ; real, current version here.
