; BIT Mark 1 firmware — Waveshare ESP32-S3-Touch-LCD-1.85 (SKU 28514).
;
; `platform = espressif32@53.3.11` (from the project's earlier notes)
; does not exist in PlatformIO's official registry — verified directly
; with `pio pkg search espressif32`, which shows only
; `platformio/espressif32` at 7.1.3 (as of 2026-09-18). Pinned to that
; real, current version instead. If `pio run` pulls in a Arduino-ESP32
; core version that breaks something pinned below (LVGL/display-panel
; libs were chosen for Arduino-ESP32 3.1.1), report the actual resolved
; framework version back before changing the other pins to match — don't
; guess at compatibility.
;
; Developed against PlatformIO Core 6.2.0.

[env:waveshare-esp32s3-touch-lcd-185]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3R8: 16MB flash, 8MB Octal PSRAM built into the chip package.
; qio_opi is the standard memory_type for the R8 (Octal PSRAM) variant —
; cross-check against Waveshare's own example project before first flash
; if boot/PSRAM behaves unexpectedly on real hardware.
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
; lv_conf.h lives in firmware/include/ (on PlatformIO's include path by
; default), so no LV_CONF_* build flag is needed for LVGL to find it.
build_flags =
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    links2004/WebSockets @ 2.7.3
    lvgl/lvgl @ 8.4.0
    esp-arduino-libs/ESP32_Display_Panel @ 1.0.5
    esp-arduino-libs/ESP32_IO_Expander @ 1.1.1
    esp-arduino-libs/esp-lib-utils @ 0.2.3
