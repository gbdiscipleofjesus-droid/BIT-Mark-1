<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spider-Man: Rompecánones 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #07060e; overflow: hidden; color: #f4f0e8; }
  :root { color-scheme: dark; --red: #e0202c; --ink: #07060e; --gold: #ffd060; --blue: #40b0ff; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .hp { position: absolute; left: 24px; top: 20px; width: min(320px, 60vw); }
  .bar { height: 10px; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.85); transform: skewX(-18deg); margin-bottom: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(#ff5060, #c01020); transition: width 0.15s; }
  .bar.focus { height: 6px; width: 70%; }
  .bar.focus i { background: linear-gradient(#80e8ff, #2090e0); }
  .obj { position: absolute; right: 24px; top: 20px; text-align: right; font-weight: 700; text-shadow: 0 2px 4px #000; max-width: 45vw; }
  .obj small { display: block; color: var(--gold); font-size: 12px; letter-spacing: 2px; }
  .sense { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 42px; color: #ffe040; text-shadow: 0 0 12px #ff8000; opacity: 0; transition: opacity 0.08s; font-weight: 900; }
  .combo { position: absolute; right: 24px; top: 40%; font-size: 34px; font-weight: 900; font-style: italic; color: #fff; text-shadow: 0 3px 0 var(--red); opacity: 0; }
  .boss { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); width: min(560px, 80vw); text-align: center; display: none; font-weight: 800; letter-spacing: 3px; text-shadow: 0 2px 4px #000; }
  .boss .bar i { background: linear-gradient(#ff8040, #c02010); }
  .toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-weight: 900; font-size: 22px; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.3s; text-align: center; }
  .dialog { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(760px, 92vw); display: none; background: rgba(10,8,20,0.88); border-left: 5px solid var(--red); padding: 12px 16px 14px 92px; min-height: 64px; box-sizing: border-box; }
  .dialog canvas { position: absolute; left: 14px; top: 12px; width: 64px; height: 64px; image-rendering: pixelated; }
  .dialog b { color: var(--gold); display: block; margin-bottom: 4px; letter-spacing: 1px; }
  .dialog span { font-size: 17px; line-height: 1.35; }
  .dialog em { position: absolute; right: 12px; bottom: 6px; font-size: 11px; color: #9a98b0; font-style: normal; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.6s; text-shadow: 0 3px 10px #000; }
  .card small { color: var(--gold); letter-spacing: 6px; font-weight: 700; }
  .card h1 { margin: 6px 0; font-size: clamp(32px, 7vw, 72px); font-style: italic; letter-spacing: 2px; }
  .card p { margin: 0; color: #c8c4d8; letter-spacing: 3px; }
  .cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.7); display: none; }
  .anchor { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 2px solid #fff; border-radius: 50%; display: none; box-shadow: 0 0 6px #40b0ff; }
  .hint { position: absolute; left: 24px; bottom: 18px; font-size: 12px; color: #d0cce0; text-shadow: 0 1px 3px #000; line-height: 1.6; }
  .hint kbd { display: inline-block; min-width: 16px; padding: 0 5px; border: 1px solid #aaa; border-radius: 3px; font-family: inherit; font-size: 11px; text-align: center; background: rgba(0,0,0,0.5); margin-right: 3px; }
  .minimap { position: absolute; right: 24px; bottom: 24px; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); background: rgba(0,0,0,0.45); overflow: hidden; }
  .menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6,4,14,0.78); pointer-events: auto; }
  .menu .box { min-width: min(420px, 90vw); text-align: center; }
  .menu h2 { font-size: 40px; font-style: italic; margin: 0 0 18px; text-shadow: 0 3px 0 var(--red); }
  .menu button { display: block; width: 100%; margin: 8px 0; padding: 12px; font: 700 16px inherit; font-family: inherit; letter-spacing: 1px; color: #fff; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); cursor: pointer; transform: skewX(-8deg); }
  .menu button.sel, .menu button:hover { background: var(--red); border-color: #fff; }
  .menu p { color: #b8b4c8; font-size: 13px; line-height: 1.5; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #07060e; font-weight: 800; letter-spacing: 4px; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="hud">
  <div class="hp"><div class="bar"><i id="hpBar" style="width:100%"></i></div><div class="bar focus"><i id="focusBar" style="width:0%"></i></div></div>
  <div class="obj"><small id="objSmall">TIERRA-616</small><span id="objText"></span></div>
  <div class="sense" id="sense">⚡ ⚡</div>
  <div class="combo" id="combo"></div>
  <div class="boss" id="boss"><div id="bossName"></div><div class="bar"><i id="bossBar" style="width:100%"></i></div></div>
  <div class="toast" id="toast"></div>
  <div class="cross" id="cross"></div>
  <div class="anchor" id="anchor"></div>
  <div class="dialog" id="dialog"><canvas id="portrait" width="24" height="24"></canvas><b id="dName"></b><span id="dText"></span><em id="dNext"></em></div>
  <div class="card" id="card"><small id="cardSmall"></small><h1 id="cardBig"></h1><p id="cardSub"></p></div>
  <div class="hint" id="hint"></div>
  <canvas class="minimap" id="minimap" width="140" height="140"></canvas>
</div>
<div class="menu" id="menu"><div class="box" id="menuBox"></div></div>
<div class="loading" id="loading">CARGANDO NUEVA YORK...</div>
<script src="lib/three.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/font.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/gfx.js"></script>
<script src="../js/sprite.js"></script>
<script src="../js/story.js"></script>
<script src="js/input3d.js"></script>
<script src="js/city.js"></script>
<script src="js/rig3d.js"></script>
<script src="js/hero.js"></script>
<script src="js/enemies3d.js"></script>
<script src="js/game3d.js"></script>
</body>
</html>
