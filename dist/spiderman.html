<script>
// ---- js/player.js ----
'use strict';
// ---------------------------------------------------------------------------
// Spider-Man
// ---------------------------------------------------------------------------
const GRAV = 950;
const PHYS = {
  run: 122, gAcc: 1100, fric: 1300, aAcc: 650, maxFall: 430, jump: -315, djump: -275,
  wallJumpX: 175, wallJumpY: -290, climb: 85, webLen: 200, swingAcc: 330, swingMax: 400,
};
const ATK = {
  punch1: { dur: 0.24, act: [0.04, 0.12], box: [6, -19, 16, 13], dmg: 1, kx: 70, ky: -40, pose: 'punch1', next: 'punch2' },
  punch2: { dur: 0.24, act: [0.04, 0.12], box: [6, -19, 16, 13], dmg: 1, kx: 80, ky: -40, pose: 'punch2', next: 'kick' },
  kick: { dur: 0.36, act: [0.08, 0.18], box: [4, -17, 21, 13], dmg: 2, kx: 240, ky: -160, pose: 'kick', heavy: true },
  uppercut: { dur: 0.38, act: [0.04, 0.16], box: [2, -32, 17, 30], dmg: 1.5, kx: 40, ky: -340, pose: 'uppercut', heavy: true },
  airkick: { dur: 0.3, act: [0.03, 0.2], box: [3, -15, 19, 15], dmg: 1.5, kx: 160, ky: -80, pose: 'airkick' },
  dive: { dur: 1.2, act: [0, 1.2], box: [-7, -8, 24, 12], dmg: 2, kx: 170, ky: -140, pose: 'dive', heavy: true },
  swingkick: { dur: 0.35, act: [0.02, 0.26], box: [2, -21, 23, 21], dmg: 3, kx: 300, ky: -130, pose: 'swingkick', heavy: true },
};

class Player {
  constructor(x, y) {
    this.w = 10; this.h = 22;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.z = 0;
    this.facing = 1; this.state = 'normal'; this.st = 0;
    this.onGround = false; this.anim = 0; this.runPhase = 0;
    this.attack = null; this.comboNext = null; this.comboT = 0; this.queued = false;
    this.coyote = 0; this.jumpBuf = 0; this.airJumps = 1; this.flipT = 0;
    this.anchor = null; this.rope = 0; this.pendingWeb = 0;
    this.wallDir = 0; this.grabCd = 0; this.lockT = 0;
    this.inv = 0; this.dodgeCd = 0; this.shootCd = 0; this.webRegen = 0;
    this.sense = 0; this.senseDir = 0; this.holdT = 0;
    this.lastSafe = { x, y }; this.safeT = 0;
    this.dropTimer = 0; this.landT = 0; this.wasGround = false;
    this.refreshStats();
    this.hp = this.maxHp; this.focus = 0; this.webs = this.maxWebs;
  }

  refreshStats() {
    const u = Game.save.upgrades;
    this.maxHp = 100 + u.hp * 20;
    this.dmgMul = 1 + u.dmg * 0.25;
    this.webStun = 2.2 + u.web * 0.6;
    this.maxWebs = 5 + u.web;
    this.swingMul = 1 + u.swing * 0.12;
    this.focusMul = 1 + u.focus * 0.3;
    if (this.hp > this.maxHp) this.hp = this.maxHp;
  }

  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get feet() { return this.y + this.h; }

  update(dt, world) {
    const lv = world.level;
    const inp = world.inputEnabled ? Input : null;
    const L = inp && inp.isDown('LEFT'), R = inp && inp.isDown('RIGHT');
    const U = inp && inp.isDown('UP'), Dn = inp && inp.isDown('DOWN');
    const pr = (a) => !!(inp && inp.pressed(a));
    const ix = (R ? 1 : 0) - (L ? 1 : 0);
    this.anim += dt;
    for (const k of ['inv', 'hurtT', 'dodgeCd', 'shootCd', 'grabCd', 'lockT', 'coyote', 'jumpBuf', 'flipT', 'comboT', 'dropTimer', 'landT', 'pendingWeb']) {
      if (this[k] > 0) this[k] = Math.max(0, this[k] - dt);
    }
    this.sense = Math.max(0, this.sense - dt);
    // recarga de cartuchos de red
    if (this.webs < this.maxWebs) {
      this.webRegen += dt;
      if (this.webRegen >= 0.8) { this.webRegen = 0; this.webs++; }
    }
    if (pr('JUMP')) this.jumpBuf = 0.12;

    if (this.state === 'dead') {
      this.vy += GRAV * dt; this.vx = approach(this.vx, 0, 300 * dt);
      lv.move(this, dt);
      this.st += dt;
      return;
    }
    if (this.state === 'cutscene') {
      this.vy = Math.min(this.vy + GRAV * dt, PHYS.maxFall);
      this.vx = approach(this.vx, 0, PHYS.fric * dt);
      lv.move(this, dt);
      if (this.anchor) this.anchor = null;
      return;
    }

    // ---- esquiva (disponible en casi todos los estados) ----
    if (pr('DODGE') && this.dodgeCd <= 0 && ['normal', 'wall', 'swing', 'facade'].includes(this.state)) {
      this.attack = null;
      const back = ix !== 0 && ix !== this.facing;
      const ground = this.onGround;
      // 4 esquivas: rueda (suelo, adelante), voltereta atrás (suelo, atrás),
      // mortal (aire, adelante) y mortal atrás girando en horizontal (aire, atrás)
      this.dodgeKind = ground ? (back ? 'backflip' : 'roll') : (back ? 'corkscrew' : 'frontflip');
      this.anchor = null;
      this.state = 'dodge'; this.st = this.dodgeDur = back ? 0.36 : 0.3;
      this.inv = Math.max(this.inv, this.dodgeDur + 0.06);
      this.dodgeHit = new Set();
      const f = this.facing;
      switch (this.dodgeKind) {
        case 'roll': this.facing = ix || f; this.vx = this.facing * 250; this.vy = 0; break;
        case 'backflip': this.vx = -f * 215; this.vy = -175; this.onGround = false; break;
        case 'frontflip': this.facing = ix || f; this.vx = this.facing * 245; this.vy = Math.min(this.vy, -130); break;
        default: this.vx = -f * 230; this.vy = Math.min(this.vy, -150); break;
      }
      this.dodgeCd = 0.6;
      Audio2.sfx('dodge');
      if (world.threatNear(this)) world.perfectDodge(this);
      world.particles.dust(this.cx, this.feet, 5);
    }

    // ---- disparo de red ----
    if (pr('SHOOT') && this.shootCd <= 0 && ['normal', 'swing', 'wall', 'facade'].includes(this.state)) {
      if (this.webs > 0) {
        this.webs--; this.shootCd = 0.3;
        let dy = 0;
        if (U) dy = -0.6; else if (Dn && !this.onGround) dy = 0.6;
        const dir = this.state === 'wall' ? -this.wallDir : this.facing;
        if (this.state === 'wall') this.facing = dir;
        world.shootWeb(this.cx + dir * 6, this.y + 7, dir, dy);
        this.shootPose = 0.2;
        Audio2.sfx('thwip');
      } else {
        world.float('SIN RED', this.cx, this.y - 6, '#a0a0a0');
      }
    }
    if (this.shootPose > 0) this.shootPose -= dt;

    // ---- especial / curación ----
    if (pr('SPECIAL') && ['normal', 'swing'].includes(this.state) && !this.attack) {
      if (this.focus >= 50) {
        if (this.onGround) { this.state = 'charge'; this.holdT = 0; this.st = 0; }
        else this.doSpin(world);
      } else {
        world.float('FOCO INSUFICIENTE', this.cx, this.y - 8, '#e0c040');
        Audio2.sfx('back');
      }
    }

    switch (this.state) {
      case 'normal': this.updNormal(dt, world, ix, U, Dn, pr); break;
      case 'wall': this.updWall(dt, world, ix, U, Dn, pr); break;
      case 'facade': this.updFacade(dt, world, ix, U, Dn, pr); break;
      case 'swing': this.updSwing(dt, world, ix, U, Dn, pr); break;
      case 'dodge': {
        this.st -= dt;
        this.vy += GRAV * (this.dodgeKind === 'roll' ? 1 : 0.55) * dt;
        lv.move(this, dt);
        // las esquivas también golpean (menos que un ataque)
        const airFlip = this.dodgeKind === 'frontflip' || this.dodgeKind === 'corkscrew';
        const box = { x: this.x - 6, y: this.y, w: this.w + 12, h: this.h + (airFlip ? 22 : 0) };
        for (const e of world.enemies) {
          if (e.dead || this.dodgeHit.has(e) || !e.hittable() || Math.abs((e.z || 0) - this.z) > LANE) continue;
          if (overlap(box, e.hurtbox())) {
            this.dodgeHit.add(e);
            world.playerHits(e, 0.6 * this.dmgMul, sign(this.vx || this.facing) * 90, this.dodgeKind === 'roll' ? -40 : -90, false);
          }
        }
        if (this.dodgeKind === 'roll' && this.onGround && Math.floor(this.st * 40) % 3 === 0) world.particles.dust(this.cx, this.feet, 1);
        if (this.st <= 0) { this.state = 'normal'; this.vx *= 0.5; }
        break;
      }
      case 'hurt':
        this.st -= dt;
        this.vy = Math.min(this.vy + GRAV * dt, PHYS.maxFall);
        if (this.onGround) this.vx = approach(this.vx, 0, 600 * dt);
        lv.move(this, dt);
        if (this.st <= 0) this.state = 'normal';
        break;
      case 'charge':
        this.holdT += dt;
        this.vx = approach(this.vx, 0, PHYS.fric * dt);
        this.vy = Math.min(this.vy + GRAV * dt, PHYS.maxFall);
        lv.move(this, dt);
        if (this.holdT > 0.15 && Math.floor(this.holdT * 30) % 3 === 0) world.particles.spark(this.cx + rand(-8, 8), this.feet - rand(0, 20), '#80ff90', 1);
        if (!Input.isDown('SPECIAL') || !world.inputEnabled) {
          if (this.holdT < 0.6) this.doSpin(world);
          else this.state = 'normal';
        } else if (this.holdT >= 0.6) {
          this.focus -= 50;
          const heal = 35;
          this.hp = Math.min(this.maxHp, this.hp + heal);
          world.float('+' + heal + ' VIDA', this.cx, this.y - 8, '#60ff80');
          Audio2.sfx('heal');
          world.particles.burst(this.cx, this.cy, 14, '#80ff90', 80);
          this.state = 'normal';
        }
        break;
      case 'special':
        this.st -= dt;
        this.vx = approach(this.vx, 0, 400 * dt);
        this.vy = Math.min(this.vy + GRAV * 0.3 * dt, 200);
        lv.move(this, dt);
        if (this.st <= 0) this.state = 'normal';
        break;
      default: this.state = 'normal';
    }

    // ---- ataques activos ----
    if (this.attack) this.updAttack(dt, world);

    // ---- profundidad: solo en la calle; en tejados, paredes y balanceo vuelve al frente ----
    if (this.state === 'wall' || this.state === 'facade' || this.state === 'swing' || (this.onGround && !onStreet(this))) this.z = approach(this.z, 0, 160 * dt);
    // ---- aterrizaje ----
    if (this.onGround && !this.wasGround) {
      if (this.vyBefore > 250) { Audio2.sfx('land'); world.particles.dust(this.cx, this.feet, 4); this.landT = 0.1; }
      this.airJumps = 1;
    }
    this.vyBefore = this.vy;
    this.wasGround = this.onGround;
    if (this.onGround) {
      this.coyote = 0.1;
      if (this.groundObj && this.groundObj.climb !== undefined && this.state === 'normal') {
        this.safeT += dt;
        // solo se guarda si hay suelo firme a ambos lados (lejos de los bordes)
        const fy = this.y + this.h;
        const firm = Math.abs(lv.surfaceY(this.cx - 28, fy - 4) - fy) < 2 && Math.abs(lv.surfaceY(this.cx + 28, fy - 4) - fy) < 2;
        if (this.safeT > 0.3 && firm) { this.lastSafe.x = this.x; this.lastSafe.y = this.y; this.safeT = 0; }
      }
    }
    // caída al agua / fuera del mapa
    if (this.y > lv.killY) world.playerFell();
  }

  updNormal(dt, world, ix, U, Dn, pr) {
    const lv = world.level;
    const control = this.lockT <= 0 && !(this.attack && this.onGround);
    // moverse hacia el fondo (arriba) o hacia delante (abajo) en la calle
    this.zMoving = false;
    if (control && onStreet(this) && !(Dn && pr('JUMP'))) {
      if (U && this.z < DEPTH_MAX) { this.z = Math.min(DEPTH_MAX, this.z + 78 * dt); this.zMoving = true; }
      if (Dn && this.z > 0) { this.z = Math.max(0, this.z - 78 * dt); this.zMoving = true; }
    }
    // movimiento horizontal
    if (control && ix) {
      const acc = this.onGround ? PHYS.gAcc : PHYS.aAcc;
      const maxS = PHYS.run;
      if (Math.abs(this.vx) <= maxS || sign(this.vx) !== ix) this.vx = clamp(this.vx + ix * acc * dt, -Math.max(maxS, Math.abs(this.vx)), Math.max(maxS, Math.abs(this.vx)));
      if (!this.attack) this.facing = ix;
    } else if (this.onGround) {
      this.vx = approach(this.vx, 0, PHYS.fric * dt);
    } else {
      this.vx = approach(this.vx, 0, 120 * dt);
    }
    if (!this.onGround && Math.abs(this.vx) > PHYS.run) this.vx = approach(this.vx, sign(this.vx) * PHYS.run, 90 * dt);
    // bajar de plataformas de un sentido
    if (Dn && this.onGround && pr('JUMP') && this.groundObj && this.groundObj.climb === undefined) {
      this.dropTimer = 0.25; this.jumpBuf = 0; this.y += 1;
    }
    // salto
    if (this.jumpBuf > 0 && !this.attack) {
      if (this.coyote > 0) {
        this.vy = PHYS.jump; this.coyote = 0; this.jumpBuf = 0; this.onGround = false;
        Audio2.sfx('jump');
      } else if (this.airJumps > 0) {
        this.vy = PHYS.djump; this.airJumps--; this.jumpBuf = 0; this.flipT = 0.4;
        Audio2.sfx('jump');
        world.particles.dust(this.cx, this.feet, 3);
      }
    }
    if (!Input.isDown('JUMP') && this.vy < -120 && !this.attack) this.vy += 1800 * dt; // salto variable
    // telaraña para balancearse
    if (pr('WEB') && !this.attack) {
      if (this.onGround) {
        this.vy = PHYS.jump * 0.85; this.onGround = false; this.coyote = 0;
        this.pendingWeb = 0.12;
        Audio2.sfx('jump');
      } else this.tryAttach(world, ix);
    }
    if (this.pendingWeb > 0 && !this.onGround && Input.isDown('WEB') && this.vy > -200) { this.pendingWeb = 0; this.tryAttach(world, ix); }
    // ataques
    if (pr('ATTACK')) {
      if (this.attack) this.queued = true;
      else this.startAttack(world, U, Dn);
    }
    // gravedad y movimiento
    const g = (this.attack && !this.onGround && this.attack.type !== 'dive') ? GRAV * 0.5 : GRAV;
    this.vy = Math.min(this.vy + g * dt, this.attack && this.attack.type === 'dive' ? 520 : PHYS.maxFall);
    lv.move(this, dt);
    // agarrarse a paredes
    if (!this.onGround && this.hitWall && this.grabCd <= 0 && this.wallObj && this.wallObj.climb && !this.attack &&
      (ix === this.hitWall || this.vy > 60)) {
      this.state = 'wall'; this.wallDir = this.hitWall; this.facing = this.hitWall;
      this.vx = 0; this.vy = 0; this.airJumps = 1;
    }
    // trepar por la fachada de un edificio: en el aire, delante del edificio, mantén ARRIBA
    if (!this.onGround && U && this.grabCd <= 0 && !this.attack) {
      const f = lv.facadeAt(this);
      if (f) { this.state = 'facade'; this.facadeObj = f; this.vx = 0; this.vy = 0; this.airJumps = 1; }
    }
  }

  updFacade(dt, world, ix, U, Dn, pr) {
    const lv = world.level, f = this.facadeObj;
    if (!f) { this.state = 'normal'; return; }
    if (pr('JUMP')) {
      this.state = 'normal'; this.vy = PHYS.jump * 0.9; this.vx = (ix || this.facing) * 90;
      this.grabCd = 0.3; this.jumpBuf = 0; Audio2.sfx('jump');
      return;
    }
    if (pr('WEB')) { this.state = 'normal'; this.grabCd = 0.3; this.vy = -150; this.tryAttach(world, ix || this.facing); return; }
    if (ix) this.facing = ix;
    this.vx = ix * 70;
    this.vy = U ? -PHYS.climb : Dn ? PHYS.climb : 0;
    lv.move(this, dt);
    // arriba del todo: subir al tejado
    if (this.y + this.h <= f.y + 3) {
      this.y = f.y - this.h; this.vy = 0; this.vx = 0; this.state = 'normal'; this.grabCd = 0.25;
      return;
    }
    // abajo del todo (donde empieza la calle): se suelta y cae a la calle
    const bottom = facadeBottom(f, lv);
    if (this.y + this.h > bottom + 1) {
      // se agarró por debajo de la parte visible: sube solo hasta la fachada
      this.y = Math.max(bottom - this.h, this.y - 180 * dt);
    } else if (this.y + this.h >= bottom - 1 && Dn) {
      this.state = 'normal'; this.grabCd = 0.35; this.vy = 40; return;
    }
    // se salió por un lado o llegó al suelo
    const cx = this.cx;
    if (cx < f.x || cx > f.x + f.w || this.onGround) { this.state = 'normal'; this.grabCd = 0.25; }
    if ((this.vx || this.vy) && Math.floor(this.anim * 8) !== Math.floor((this.anim - dt) * 8)) Audio2.sfx('step');
  }

  updWall(dt, world, ix, U, Dn, pr) {
    const lv = world.level;
    this.facing = this.wallDir;
    let vy = 0;
    if (U) vy = -PHYS.climb; else if (Dn) vy = PHYS.climb;
    this.vx = this.wallDir * 40; this.vy = vy;
    const oldY = this.y;
    lv.move(this, dt);
    if (pr('JUMP')) {
      this.state = 'normal';
      this.vx = -this.wallDir * PHYS.wallJumpX; this.vy = PHYS.wallJumpY;
      this.facing = -this.wallDir; this.grabCd = 0.22; this.lockT = 0.14; this.jumpBuf = 0;
      Audio2.sfx('jump');
      return;
    }
    if (pr('WEB')) { this.state = 'normal'; this.grabCd = 0.25; this.vx = -this.wallDir * 120; this.vy = -150; this.tryAttach(world, -this.wallDir); return; }
    if (this.hitWall !== this.wallDir) {
      if (vy < 0) {
        // subir al tejado
        this.state = 'normal'; this.vy = -230; this.vx = this.wallDir * 90; this.grabCd = 0.3;
        return;
      }
      this.state = 'normal'; this.grabCd = 0.2;
      return;
    }
    if (this.onGround && Dn) { this.state = 'normal'; this.grabCd = 0.3; return; }
    if (ix === -this.wallDir) { this.state = 'normal'; this.grabCd = 0.25; this.vx = -this.wallDir * 60; return; }
    if (this.hitCeil && vy < 0) this.y = oldY;
    if (vy !== 0 && Math.floor(this.anim * 8) !== Math.floor((this.anim - dt) * 8)) Audio2.sfx('step');
  }

  tryAttach(world, ix) {
    const lv = world.level;
    let dir = ix || (Math.abs(this.vx) > 30 ? sign(this.vx) : this.facing);
    this.facing = dir;
    const hx = this.cx, hy = this.y + 4;
    const tries = [38, 22, 55];
    for (const deg of tries) {
      const a = deg * D2R;
      const dx = dir * Math.sin(a), dy = -Math.cos(a);
      const hit = lv.raycast(hx, hy, dx, dy, PHYS.webLen);
      let ax, ay;
      if (hit) { ax = hit.x; ay = hit.y; }
      else if (!lv.indoor) {
        const len = 150;
        ax = hx + dx * len; ay = hy + dy * len;
        if (ay < lv.anchorMinY) continue;
      } else continue;
      if (hy - ay < 24) continue;
      this.anchor = { x: ax, y: ay };
      this.rope = Math.max(40, Math.hypot(ax - hx, ay - hy));
      this.state = 'swing';
      this.attack = null;
      Audio2.sfx('thwip');
      return true;
    }
    world.float('¡SIN ANCLAJE!', this.cx, this.y - 8, '#c0c0c0');
    return false;
  }

  updSwing(dt, world, ix, U, Dn, pr) {
    const lv = world.level;
    const a = this.anchor;
    if (!a) { this.state = 'normal'; return; }
    if (!Input.isDown('WEB') || !world.inputEnabled) { this.releaseSwing(); return; }
    if (pr('ATTACK')) {
      this.releaseSwing();
      this.attack = { type: 'swingkick', t: 0, hit: new Set(), def: ATK.swingkick };
      this.vx += this.facing * 40;
      Audio2.sfx('whoosh');
      return;
    }
    if (pr('JUMP')) { this.releaseSwing(); this.vy = Math.min(this.vy, 0) - 140; Audio2.sfx('jump'); return; }
    const hx = this.cx, hy = this.y + 4;
    let dx = hx - a.x, dy = hy - a.y;
    let len = Math.hypot(dx, dy) || 1;
    // impulso tangencial
    if (ix && dy > 0) {
      let tx = -dy / len, ty = dx / len;
      if (tx * ix < 0) { tx = -tx; ty = -ty; }
      this.vx += tx * PHYS.swingAcc * this.swingMul * dt;
      this.vy += ty * PHYS.swingAcc * this.swingMul * dt;
      this.facing = ix;
    } else if (Math.abs(this.vx) > 20) this.facing = sign(this.vx);
    if (U) this.rope = Math.max(40, this.rope - 100 * dt);
    if (Dn) this.rope = Math.min(PHYS.webLen + 20, this.rope + 100 * dt);
    this.vy += GRAV * dt;
    lv.move(this, dt);
    if (this.onGround) { this.releaseSwing(); return; }
    if (this.hitWall && this.wallObj && this.wallObj.climb) {
      this.anchor = null; this.state = 'wall'; this.wallDir = this.hitWall; this.facing = this.hitWall; this.vx = 0; this.vy = 0;
      return;
    }
    // restricción de cuerda
    dx = this.cx - a.x; dy = this.y + 4 - a.y;
    len = Math.hypot(dx, dy) || 1;
    if (len > this.rope) {
      const nx = dx / len, ny = dy / len;
      const tx = a.x + nx * this.rope - this.w / 2, ty = a.y + ny * this.rope - 4;
      if (lv.rectFree({ x: tx, y: ty, w: this.w, h: this.h })) { this.x = tx; this.y = ty; }
      const vr = this.vx * nx + this.vy * ny;
      if (vr > 0) { this.vx -= vr * nx; this.vy -= vr * ny; }
    }
    const sp = Math.hypot(this.vx, this.vy), mx = PHYS.swingMax * this.swingMul;
    if (sp > mx) { this.vx *= mx / sp; this.vy *= mx / sp; }
    if (dy < -6) this.releaseSwing();
  }

  releaseSwing() {
    if (this.state !== 'swing') return;
    this.state = 'normal';
    this.anchor = null;
    this.vx *= 1.12;
    if (this.vy < 0) this.vy -= 50;
    this.airJumps = 1;
    this.grabCd = 0.1;
    Audio2.sfx('whoosh');
  }

  startAttack(world, U, Dn) {
    let type;
    if (!this.onGround) {
      if (Dn) type = 'dive';
      else if (Math.hypot(this.vx, this.vy) > 230) type = 'swingkick';
      else type = 'airkick';
    } else if (U && !onStreet(this)) type = 'uppercut';
    else if (this.comboT > 0 && this.comboNext) type = this.comboNext;
    else type = 'punch1';
    this.attack = { type, t: 0, hit: new Set(), def: ATK[type] };
    if (type === 'dive') { this.vy = 380; this.vx = this.facing * 70; }
    else if (type === 'uppercut') { this.vy = -200; this.onGround = false; }
    else if (this.onGround) this.vx = this.facing * 60;
    Audio2.sfx(type === 'kick' || type === 'uppercut' ? 'whoosh' : 'dodge');
  }

  updAttack(dt, world) {
    const at = this.attack;
    const d = at.def;
    at.t += dt;
    if (at.type === 'dive' && this.onGround) {
      world.particles.dust(this.cx, this.feet, 8);
      world.shake(3);
      Audio2.sfx('heavy');
      world.areaHit(this.cx, this.feet - 8, 28, 1, 120, -160, this);
      this.attack = null;
      return;
    }
    if (at.t >= d.act[0] && at.t <= d.act[1]) {
      const [bx, by, bw, bh] = d.box;
      const box = { x: this.facing > 0 ? this.cx + bx : this.cx - bx - bw, y: this.feet + by, w: bw, h: bh };
      for (const e of world.enemies) {
        if (e.dead || at.hit.has(e) || !e.hittable()) continue;
        if (Math.abs((e.z || 0) - this.z) > LANE) continue;
        if (overlap(box, e.hurtbox())) {
          at.hit.add(e);
          world.playerHits(e, d.dmg * this.dmgMul, d.kx * this.facing, d.ky, !!d.heavy);
        }
      }
      world.hitObjects(box, this);
    }
    if (at.t >= d.dur) {
      this.attack = null;
      if (d.next) { this.comboNext = d.next; this.comboT = 0.35; }
      else { this.comboNext = null; this.comboT = 0; }
      if (this.queued && this.onGround && d.next) {
        this.queued = false;
        this.attack = { type: d.next, t: 0, hit: new Set(), def: ATK[d.next] };
        this.vx = this.facing * 60;
        Audio2.sfx(d.next === 'kick' ? 'whoosh' : 'dodge');
      }
      this.queued = false;
    }
  }

  doSpin(world) {
    this.focus -= 50;
    this.state = 'special'; this.st = 0.55;
    this.vy = -120;
    this.attack = null;
    Audio2.sfx('special');
    world.shake(4);
    world.particles.burst(this.cx, this.cy, 24, '#ffffff', 160);
    world.areaHit(this.cx, this.cy, 80, 3 * this.dmgMul, 260, -200, this, true);
  }

  gainFocus(v) { this.focus = Math.min(100, this.focus + v * this.focusMul); }

  hurtbox() { return { x: this.x + 1, y: this.y + 2, w: this.w - 2, h: this.h - 2 }; }

  // Devuelve true si el golpe entró
  takeDamage(dmg, srcX, world) {
    if (this.inv > 0 || this.state === 'dodge' || this.state === 'dead' || this.state === 'cutscene') return false;
    this.hp -= dmg;
    this.inv = 1.0; this.hurtT = 1.0;
    this.anchor = null; this.attack = null;
    const dir = this.cx >= srcX ? 1 : -1;
    this.state = 'hurt'; this.st = 0.3;
    this.vx = dir * 150; this.vy = -170;
    Audio2.sfx('hurt');
    Input.rumble(0.8, 0.4, 180);
    world.shake(4);
    world.particles.burst(this.cx, this.cy, 8, '#ff4040', 90);
    if (this.hp <= 0) {
      this.hp = 0; this.state = 'dead'; this.st = 0;
      world.onPlayerDeath();
    }
    return true;
  }

  // ---------------- Dibujo ----------------
  draw(ctx, cam, t) {
    // parpadea solo tras recibir daño (no durante esquivas)
    if (this.hurtT > 0 && this.state !== 'dead' && Math.floor(this.hurtT * 16) % 2 === 0) return;
    const suit = SUITS.find((s) => s.id === Game.save.suit) || SUITS[0];
    const pal = suit.palObj;
    const x = Math.round(this.cx - cam.x), y = Math.round(this.feet - cam.y);
    let pose, f = this.facing;
    let dx = 0;
    switch (this.state) {
      case 'dead': pose = Poses.ko(); break;
      case 'hurt': pose = Poses.hurt(); break;
      case 'dodge': {
        const u = clamp(1 - this.st / (this.dodgeDur || 0.3), 0, 1);
        if (this.dodgeKind === 'roll') pose = Poses.roll(u);
        else if (this.dodgeKind === 'backflip') pose = Poses.backflip(u);
        else if (this.dodgeKind === 'frontflip') pose = Poses.flip(u);
        else { pose = Poses.corkscrew(u); this.spinX = Math.cos(u * TAU * 1.5); }
        break;
      }
      case 'wall': pose = Poses.wall(this.vy !== 0 ? this.anim : 0); f = this.wallDir; dx = f * 2; break;
      case 'facade': pose = Poses.wall((this.vy !== 0 || this.vx !== 0) ? this.anim : 0); pose.t = 0; break;
      case 'charge': pose = Poses.heal(this.anim); break;
      case 'special': pose = Poses.special(0.55 - this.st); break;
      case 'swing': {
        const a = this.anchor;
        const lx = (a.x - this.cx) * f, ly = a.y - (this.y + 4);
        const ang = Math.atan2(lx, -ly) / D2R;
        pose = Poses.swing(170);
        pose.rot = ang * 0.9;
        break;
      }
      default:
        if (this.attack) pose = Poses[this.attack.def.pose]();
        else if (this.shootPose > 0) pose = Poses.shoot();
        else if (this.onGround) {
          if (Math.abs(this.vx) > 12 || this.zMoving) { this.runPhase += Math.max(Math.abs(this.vx), this.zMoving ? 80 : 0) * 0.0022 * 6; pose = Poses.run(this.runPhase); }
          else if (this.landT > 0) pose = Poses.crouch();
          else pose = Poses.idle(t);
        } else if (this.flipT > 0) pose = Poses.flip(0.4 - this.flipT);
        else pose = this.vy < 0 ? Poses.jump() : Poses.fall();
    }
    // inclinación según la velocidad al correr
    if (this.onGround && this.state === 'normal' && !this.attack && Math.abs(this.vx) > 12) pose.t += 6;
    // aterrizaje con peso: se hunde un poco
    if (this.landT > 0 && this.state === 'normal') pose.hy = (pose.hy || 0) + Math.round(this.landT * 30);
    const SC = 1.2;
    // estela de movimiento cuando va rápido (balanceo, esquiva, picado, patada balanceada)
    const speed = Math.hypot(this.vx, this.vy);
    const fast = speed > 230 || this.state === 'dodge' || (this.attack && (this.attack.type === 'dive' || this.attack.type === 'swingkick'));
    if (!this.trail) this.trail = [];
    this.trailT = (this.trailT || 0) + 1;
    if (fast && this.trailT % 2 === 0) this.trail.push({ x: this.cx, y: this.feet, f, pose: Object.assign({}, pose), life: 1 });
    for (const tr of this.trail) tr.life -= 0.12;
    this.trail = this.trail.filter((tr) => tr.life > 0);
    for (const tr of this.trail) {
      ctx.globalAlpha = tr.life * 0.35;
      Rig.draw(ctx, Math.round(tr.x - cam.x), Math.round(tr.y - cam.y), tr.f, tr.pose, TRAIL_PAL, { scale: SC });
    }
    ctx.globalAlpha = 1;
    const cork = this.state === 'dodge' && this.dodgeKind === 'corkscrew';
    if (cork) {
      const k = this.spinX || 1;
      ctx.save(); ctx.translate(x, 0); ctx.scale(Math.abs(k) < 0.2 ? 0.2 * sign(k || 1) : k, 1); ctx.translate(-x, 0);
    }
    const wp = Rig.draw(ctx, x + dx, y, f, pose, pal, { scale: SC });
    if (cork) ctx.restore();
    // arco de impacto durante los golpes
    if (this.attack) {
      const d = this.attack.def, at = this.attack.t;
      if (at >= d.act[0] && at <= d.act[1] + 0.04) {
        const u = (at - d.act[0]) / Math.max(0.05, d.act[1] - d.act[0]);
        const heavy = !!d.heavy;
        const r = heavy ? 14 : 10;
        const cx0 = x + f * (d.box[0] + d.box[2] * 0.5), cy0 = y + d.box[1] + d.box[3] * 0.5;
        ctx.strokeStyle = heavy ? 'rgba(255,230,120,0.85)' : 'rgba(255,255,255,0.8)';
        ctx.lineWidth = heavy ? 2 : 1;
        ctx.beginPath();
        const a0 = f > 0 ? -1.2 : Math.PI + 1.2, a1 = f > 0 ? -1.2 + 2.4 * Math.min(1, u + 0.3) : Math.PI + 1.2 - 2.4 * Math.min(1, u + 0.3);
        ctx.arc(cx0 - f * 4, cy0, r, Math.min(a0, a1), Math.max(a0, a1));
        ctx.stroke();
      }
    }
    // línea de telaraña
    if (this.state === 'swing' && this.anchor) {
      ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wp.h2[0] + 0.5, wp.h2[1] + 0.5);
      ctx.lineTo(Math.round(this.anchor.x - cam.x) + 0.5, Math.round(this.anchor.y - cam.y) + 0.5);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(this.anchor.x - cam.x) - 1, Math.round(this.anchor.y - cam.y) - 1, 3, 3);
    }
    // hormigueo arácnido
    if (this.sense > 0) {
      ctx.fillStyle = Math.floor(t * 20) % 2 ? '#ffffff' : '#ffe040';
      const hx = wp.head[0], hy = wp.head[1];
      for (const s of [-1, 1]) {
        const bx = hx + s * 5;
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(bx + s * i * 2, hy - 6 - i * 2, 1, 2);
          ctx.fillRect(bx + s * i * 2 + s, hy - 8 - i * 2, 1, 2);
        }
      }
    }
    if (this.state === 'charge' && this.holdT > 0.15) {
      ctx.fillStyle = 'rgba(120,255,140,0.25)';
      const r = 8 + this.holdT * 12;
      ctx.fillRect(x - r, y - 26, r * 2, 28);
    }
  }
}

<script>
// ---- js/enemies.js ----
'use strict';
// ---------------------------------------------------------------------------
// Enemigos, jefes, proyectiles, objetos y partículas

const THUG_PALS = [
  { torso: '#4a5a2a', leg: '#2a3450', hair: '#1a1a1a', face: 'beanie', head: '#d8a070' },

  { torso: '#2a3a5a', leg: '#3a3a3a', hair: '#8a2020', face: 'beanie', head: '#e0b088' },

].map((p) => makePal(Object.assign({ boot: '#1a1a1a', outline: '#140a12' }, p)));
const THEME_PALS = {
  thugs: THUG_PALS,
  oscorp: [
    { torso: '#2a2e36', torsoLow: '#1a1c22', leg: '#1a1c22', head: '#20242a', hair: '#20242a', face: 'visor', eye: '#60ff90' },
    { torso: '#3a3e46', torsoLow: '#22252c', leg: '#22252c', head: '#20242a', hair: '#20242a', face: 'visor', eye: '#60ffe0' },
  ].map((p) => makePal(Object.assign({ boot: '#101014', outline: '#08080a' }, p))),
  kingpin: [
    { torso: '#3a1a4a', torsoLow: '#1a0a24', leg: '#1a1a22', head: '#c89070', hair: '#141414', face: 'human' },
    { torso: '#1a1a22', torsoLow: '#101014', leg: '#101014', head: '#8a5a3a', hair: '#141414', face: 'beanie' },
    { torso: '#e0205a', torsoLow: '#1a1a22', leg: '#1a1a22', head: '#e0b088', hair: '#e0e040', face: 'human' },
  ].map((p) => makePal(Object.assign({ boot: '#0a0a0a', outline: '#000000' }, p))),
  zombie: [
    { torso: '#3a4a2a', leg: '#2a2a3a', head: '#7a9a6a', hair: '#2a3a1a', face: 'human', eye: '#ff3030' },
    { torso: '#5a2a2a', leg: '#2a2a2a', head: '#8aaa7a', hair: '#1a1a1a', face: 'human', eye: '#ff3030' },
    { torso: '#6a1818', torsoLow: '#e0b030', leg: '#6a1818', head: '#6a1818', hair: '#6a1818', face: 'spider', eye: '#ffe0a0', emblem: '#140a12' },
  ].map((p) => makePal(Object.assign({ boot: '#1a1a1a', outline: '#0a0a06' }, p))),
};
let ENEMY_THEME = 'thugs';
const CHITAURI_PAL = makePal({ torso: '#3a2a4a', torsoLow: '#2a2030', arm: '#4a3a5a', leg: '#2a2030', boot: '#1a1420', head: '#20202a', hair: '#20202a', face: 'visor', eye: '#c060ff', outline: '#0a0610' });
const BRUTE_PAL = makePal({ torso: '#5a5a62', torsoLow: '#3a3a42', arm: '#6a4a3a', arm2: '#c89070', hand: '#c89070', leg: '#2a2a34', boot: '#1a1a1a', head: '#c89070', hair: '#1a1a1a', face: 'beanie', outline: '#140a12' });

const ENEMY_SPECS = {
  thug: { hp: 5, speed: 58, range: 17, windup: 0.5, dmg: 9, cd: [0.9, 1.9], kind: 'melee', tech: 1 },
  bat: { hp: 6, speed: 52, range: 25, windup: 0.62, dmg: 13, cd: [1.1, 2.0], kind: 'melee', weapon: 'bat', tech: 2 },
  gunner: { hp: 4, speed: 55, kind: 'ranged', prefer: [90, 150], windup: 0.7, dmg: 8, cd: [1.4, 2.4], proj: 'bullet', pspeed: 230, weapon: 'gun', tech: 2 },
  chitauri: { hp: 5, speed: 48, kind: 'ranged', prefer: [70, 140], windup: 0.8, dmg: 11, cd: [1.6, 2.6], proj: 'orb', pspeed: 150, weapon: 'alien', tech: 3 },
  brute: { hp: 14, speed: 42, range: 26, windup: 0.8, dmg: 17, cd: [1.4, 2.4], kind: 'melee', armor: 0.35, scale: 1.35, w: 14, h: 30, tech: 4 },
  drone: { hp: 3, speed: 70, kind: 'ranged', prefer: [60, 130], windup: 0.8, dmg: 8, cd: [1.6, 2.6], proj: 'laser', pspeed: 210, fly: true, w: 12, h: 8, tech: 2 },
  zombie: { hp: 6, speed: 34, range: 16, windup: 0.7, dmg: 11, cd: [1.0, 2.0], kind: 'melee', tech: 1 },
  ultron: { hp: 4, speed: 80, kind: 'ranged', prefer: [60, 130], windup: 0.7, dmg: 9, cd: [1.4, 2.2], proj: 'laser', pspeed: 230, fly: true, w: 12, h: 9, tech: 2 },
  decoy: { hp: 1, speed: 70, kind: 'ranged', prefer: [60, 140], windup: 0.9, dmg: 7, cd: [3, 4.5], proj: 'laser', pspeed: 200, fly: true, w: 14, h: 10, tech: 0 },
};
const DIFF_DMG = [0.6, 1, 1.4], DIFF_HP = [0.8, 1, 1.25], DIFF_TOKENS = [2, 3, 4];
// Dificultad aumentada: más vida, más daño, ataques más rápidos y más frecuentes
const TOUGH = { hp: 1.6, dmg: 1.3, windup: 0.8, cd: 0.75, speed: 1.2 };
const BLOCK_CHANCE = { thug: 0.25, bat: 0.3, brute: 0.35, chitauri: 0.2 };
for (const k in ENEMY_SPECS) {
  if (k === 'decoy') continue;
  const sp = ENEMY_SPECS[k];
  sp.hp = Math.round(sp.hp * TOUGH.hp); sp.dmg = Math.round(sp.dmg * TOUGH.dmg);
  sp.windup *= TOUGH.windup; sp.cd = sp.cd.map((v) => v * TOUGH.cd); sp.speed *= TOUGH.speed;
  sp.block = BLOCK_CHANCE[k] || 0;
}
// Jefes MUCHO más duros
const BOSS_HP_MUL = [1.4, 2.2, 2.8], BOSS_DMG_MUL = [1.0, 1.4, 1.7];
const BOSS_SPEED = [1, 1.15, 1.45, 1.75];
let ENEMY_ID = 0;

class Enemy {
  constructor(type, x, y) {
    const sp = ENEMY_SPECS[type] || ENEMY_SPECS.thug;
    this.id = ++ENEMY_ID;
    this.type = type; this.spec = sp;
    this.w = sp.w || 10; this.h = sp.h || 22;
    this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.z = 0;
    this.hp = this.maxHp = Math.ceil(sp.hp * DIFF_HP[Game.settings.difficulty]);
    this.facing = -1; this.state = 'idle'; this.t = 0; this.anim = rand(0, 5);
    this.cd = rand(0.4, 1.2); this.webbed = 0; this.flash = 0; this.dead = false; this.koT = 0;
    this.fly = !!sp.fly; this.scale = sp.scale || 1;
    const pals = THEME_PALS[type === 'zombie' ? 'zombie' : ENEMY_THEME] || THUG_PALS;
    this.pal = type === 'chitauri' ? CHITAURI_PAL : (type === 'brute' && ENEMY_THEME !== 'zombie') ? BRUTE_PAL : pals[this.id % pals.length];
    this.hasToken = false; this.arena = null; this.aggro = false; this.onGround = false;
    this.hoverY = y; this.isBoss = false; this.noReward = false;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  hurtbox() { return { x: this.x - 1, y: this.y, w: this.w + 2, h: this.h }; }
  hittable() { return !this.dead; }
  dmg() { return Math.round(this.spec.dmg * DIFF_DMG[Game.settings.difficulty]); }

  update(dt, world) {
    this.anim += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.dead) {
      this.koT -= dt;
      this.vy = Math.min(this.vy + GRAV * dt, 400);
      if (this.onGround) this.vx = approach(this.vx, 0, 500 * dt);
      world.level.move(this, dt);
      if (this.koT <= 0) this.remove = true;
      return;
    }
    const p = world.player;
    const dx = p.cx - this.cx, dy = p.cy - this.cy, adx = Math.abs(dx);
    if (this.webbed > 0) {
      this.webbed -= dt;
      this.releaseToken(world);
      this.vx = approach(this.vx, 0, 400 * dt);
      this.vy = Math.min(this.vy + GRAV * dt, 400);
      world.level.move(this, dt);
      if (this.webbed <= 0) { this.state = 'chase'; this.t = 0; this.hoverY = Math.min(this.hoverY, this.y - 40); }
      this.clampArena();
      return;
    }
    if (this.cd > 0) this.cd -= dt;
    switch (this.state) {
      case 'idle':
        if ((adx < 210 && Math.abs(dy) < 140) || this.aggro) { this.state = 'chase'; this.aggro = true; }
        break;
      case 'chase': {
        this.facing = dx >= 0 ? 1 : -1;
        const sp = this.spec;
        let want = 0;
        if (sp.kind === 'ranged') {
          if (adx < sp.prefer[0]) want = -this.facing;
          else if (adx > sp.prefer[1]) want = this.facing;
          if (this.cd <= 0 && adx < sp.prefer[1] + 60 && Math.abs(dy) < (this.fly ? 160 : 70) && Math.abs(this.z - p.z) < LANE && world.onScreen(this)) {
            this.state = 'windup'; this.t = sp.windup; want = 0;
          }
        } else {
          if (adx > sp.range) want = this.facing;
          if (adx <= sp.range + 4 && Math.abs(dy) < 26 && Math.abs(this.z - p.z) < 6 && this.cd <= 0 && this.takeToken(world)) {
            this.state = 'windup'; this.t = sp.windup; want = 0;
          }
        }
        // no caer por bordes
        if (want && !this.fly && this.onGround) {
          const ahead = world.level.groundAhead(this.cx + want * (this.w / 2 + 4), this.y + this.h);
          if (!ahead) want = 0;
        }
        this.vx = approach(this.vx, want * sp.speed, 500 * dt);
        break;
      }
      case 'windup':
        this.t -= dt;
        this.vx = approach(this.vx, 0, 600 * dt);
        this.facing = dx >= 0 ? 1 : -1;
        if (this.t <= 0) this.doAttack(world);
        break;
      case 'attack':
        this.t -= dt;
        if (this.spec.kind === 'melee' && !this.hitDone) {
          const r = this.spec.range * this.scale;
          const box = { x: this.facing > 0 ? this.cx : this.cx - r - 4, y: this.y + 2, w: r + 4, h: this.h - 4 };
          if (overlap(box, p.hurtbox())) {
            this.hitDone = true;
            world.damagePlayer(this.dmg(), this.cx, this.z);
          }
        }
        if (this.burst > 0 && this.t < 0.08) { this.burst--; this.fire(world); }
        if (this.t <= 0) { this.state = 'recover'; this.t = 0.35; this.cd = rand(...this.spec.cd); this.releaseToken(world); }
        break;
      case 'recover':
        this.t -= dt;
        this.vx = approach(this.vx, 0, 600 * dt);
        if (this.t <= 0) this.state = 'chase';
        break;
      case 'guard':
        this.t -= dt;
        this.vx = approach(this.vx, 0, 300 * dt);
        this.facing = dx >= 0 ? 1 : -1;
        if (this.t <= 0) { this.state = 'chase'; this.cd = Math.min(this.cd, 0.2); }
        break;
      case 'hurt':
        this.t -= dt;
        if (this.onGround) this.vx = approach(this.vx, 0, 500 * dt);
        if (this.t <= 0) this.state = 'chase';
        break;
      case 'air':
        if (this.onGround && this.vy >= 0) { this.state = 'down'; this.t = 0.5; }
        break;
      case 'down':
        this.t -= dt;
        this.vx = approach(this.vx, 0, 500 * dt);
        if (this.t <= 0) this.state = 'chase';
        break;
      default: this.state = 'chase';
    }
    this.updZ(dt, p, 45);
    if (this.fly && this.state !== 'air' && this.state !== 'down') {
      const targetY = Math.min(this.hoverY, p.y - 50) + Math.sin(this.anim * 2) * 8;
      this.vy = approach(this.vy, clamp((targetY - this.y) * 2, -80, 80), 300 * dt);
    } else {
      this.vy = Math.min(this.vy + GRAV * dt, 450);
    }
    world.level.move(this, dt);
    if (this.fly && (this.state === 'air' || this.state === 'down') && this.onGround && this.state === 'down' && this.t <= 0.05) this.hoverY = this.y - 50;
    this.clampArena();
  }

  // Profundidad (estilo beat 'em up): en la calle se alinean con Spider-Man
  updZ(dt, p, speed) {
    const street = onStreet(this);
    if (street || this.fly) {
      if (this.state !== 'idle' && this.state !== 'attack' && this.state !== 'hurt') {
        this.z = approach(this.z, clamp(p.z, 0, DEPTH_MAX), speed * dt);
      }
    } else if (this.onGround) this.z = approach(this.z, 0, 120 * dt);
  }

  clampArena() {
    if (this.arena) {
      if (this.x < this.arena.x1 + 2) { this.x = this.arena.x1 + 2; if (this.vx < 0) this.vx = 0; }
      if (this.x + this.w > this.arena.x2 - 2) { this.x = this.arena.x2 - 2 - this.w; if (this.vx > 0) this.vx = 0; }
    }
  }

  doAttack(world) {
    const sp = this.spec;
    this.state = 'attack'; this.hitDone = false;
    if (sp.kind === 'melee') {
      this.t = 0.16;
      this.vx = this.facing * 60;
      Audio2.sfx('whoosh');
    } else {
      this.t = 0.24;
      this.burst = sp.proj === 'bullet' ? 1 : 0;
      this.fire(world);
    }
  }

  fire(world) {
    const sp = this.spec;
    const p = world.player;
    const ox = this.cx + this.facing * 8, oy = this.fly ? this.y + this.h : this.y + 8;
    let ax = p.cx - ox, ay = p.cy - oy;
    if (sp.proj === 'bullet') ay = clamp(ay, -Math.abs(ax) * 0.3, Math.abs(ax) * 0.3);
    const l = Math.hypot(ax, ay) || 1;
    world.addProj(new Proj(sp.proj, ox, oy, ax / l * sp.pspeed, ay / l * sp.pspeed, 'e', this.dmg()));
    Audio2.sfx(sp.proj === 'laser' ? 'laser' : 'shoot');
  }

  takeToken(world) {
    if (this.hasToken) return true;
    if (world.tokensUsed < DIFF_TOKENS[Game.settings.difficulty]) { world.tokensUsed++; this.hasToken = true; return true; }
    return false;
  }
  releaseToken(world) {
    if (this.hasToken) { this.hasToken = false; world.tokensUsed = Math.max(0, world.tokensUsed - 1); }
  }

  takeHit(dmg, kx, ky, heavy, world) {
    if (this.dead) return false;
    // Guardia: bloquea golpes normales de frente; un golpe fuerte la rompe
    const facingHit = sign(kx) === -this.facing || kx === 0;
    if (this.state === 'guard') {
      if (heavy) { this.state = 'hurt'; this.t = 0.6; this.flash = 0.15; world.float('¡GUARDIA ROTA!', this.cx, this.y - 8, '#ffe060'); Audio2.sfx('heavy'); dmg *= 1.3; }
      else { this.blockFx(world); return false; }
    } else if (this.spec.block && !heavy && this.webbed <= 0 && facingHit && ['chase', 'recover', 'idle'].includes(this.state) && Math.random() < this.spec.block) {
      this.state = 'guard'; this.t = 0.55; this.aggro = true;
      this.blockFx(world);
      return false;
    }
    const armored = this.spec.armor && this.webbed <= 0 && this.state !== 'down' && this.state !== 'air';
    const eff = dmg * (this.webbed > 0 ? 1.5 : 1) * (armored ? this.spec.armor : 1);
    this.hp -= eff;
    this.flash = 0.1;
    this.aggro = true;
    if (this.hp <= 0) { this.die(kx, world); return true; }
    if (armored && !heavy) { this.vx = kx * 0.15; return true; }
    this.releaseToken(world);
    if (this.webbed > 0) { this.vx = kx * 0.3; return true; }
    this.vx = kx * (armored ? 0.3 : 1);
    if (ky < -200 && !armored) { this.vy = ky; this.state = 'air'; this.onGround = false; }
    else { this.vy = this.onGround ? ky * 0.35 : Math.min(this.vy, ky * 0.5); this.state = this.state === 'air' ? 'air' : 'hurt'; this.t = 0.3; }
    return true;
  }

  blockFx(world) {
    world.particles.burst(this.cx + this.facing * 6, this.cy - 2, 5, '#80c0ff', 60);
    world.float('BLOQUEO', this.cx, this.y - 8, '#80c0ff');
    Audio2.sfx('webhit');
    this.vx = -this.facing * 40;
  }

  web(dur, world) {
    if (this.dead) return;
    if (this.type === 'decoy') { this.die(0, world); return; }
    this.webbed = dur;
    this.state = 'hurt'; this.t = 0.1;
    this.releaseToken(world);
    world.particles.burst(this.cx, this.cy, 6, '#ffffff', 60);
  }

  die(kx, world) {
    this.dead = true; this.state = 'ko'; this.koT = 1.1;
    this.vx = kx * 1.1 + sign(kx) * 60; this.vy = -180;
    this.fly = false;
    this.releaseToken(world);
    world.onEnemyKO(this);
  }

  // ---------------- dibujo ----------------
  draw(ctx, cam, t) {
    if (this.dead && this.koT < 0.5 && Math.floor(this.koT * 20) % 2) return;
    const x = Math.round(this.cx - cam.x), y = Math.round(this.y + this.h - cam.y);
    if (x < -60 || x > W + 60 || y < -60 || y > H + 80) return;
    if (this.type === 'drone' || this.type === 'decoy' || this.type === 'ultron') { this.drawDrone(ctx, x, y - this.h, t); return; }
    let pose;
    if (this.dead) { pose = Poses.ko(); if (!this.onGround) pose.rot = -90 - ((this.anim * 900) % 360); }
    else if (this.webbed > 0) { pose = Poses.webbed(); pose.rot = Math.sin(this.anim * 25) * 6; }
    else switch (this.state) {
      case 'guard': pose = Poses.guard(); break;
      case 'windup': pose = this.spec.kind === 'ranged' ? Poses.aim() : Poses.windup(); if (this.spec.kind !== 'ranged') pose.t -= 8 * (1 - this.t / this.spec.windup); break;
      case 'attack': pose = this.spec.kind === 'ranged' ? Poses.aim() : (this.spec.weapon === 'bat' ? Poses.punch2() : Poses.punch1()); break;
      case 'hurt': pose = Poses.hurt(); break;
      case 'air': pose = Poses.hurt(); pose.rot = -30; break;
      case 'down': pose = Poses.ko(); break;
      default:
        pose = Math.abs(this.vx) > 8 ? Poses.run(this.anim * (this.type === 'zombie' ? 5 : 9)) : Poses.idle(this.anim);
        if (this.type === 'zombie') { pose.a1 = 80; pose.b1 = 85; pose.a2 = 0; pose.b2 = 0; pose.h = Math.sin(this.anim * 3) * 20; }
    }
    const pal = this.flash > 0 ? FLASH_PAL : this.pal;
    // temblor al recibir un golpe
    const jit = this.state === 'hurt' && this.t > 0.18 ? (Math.floor(t * 60) % 2 ? 1 : -1) : 0;
    const sc = this.scale * 1.12;
    const wp = Rig.draw(ctx, x + jit, y, this.facing, pose, pal, { scale: sc, bulk: this.type === 'brute' ? 6 : 4 });
    this.drawOutfit(ctx, wp, t, sc);
    // arco del golpe enemigo
    if (this.state === 'attack' && this.spec.kind === 'melee' && !this.dead) {
      ctx.strokeStyle = 'rgba(255,120,90,0.8)'; ctx.lineWidth = 1;
      ctx.beginPath();
      const cx0 = x + this.facing * 10 * this.scale, cy0 = y - 14 * this.scale;
      ctx.arc(cx0, cy0, 9 * this.scale, this.facing > 0 ? -1 : Math.PI - 0.4, this.facing > 0 ? 0.4 : Math.PI + 1);
      ctx.stroke();
    }
    if (this.state === 'guard' && !this.dead) {
      ctx.fillStyle = Math.floor(t * 12) % 2 ? 'rgba(128,192,255,0.6)' : 'rgba(128,192,255,0.3)';
      ctx.fillRect(x + this.facing * 7 - 1, y - 24 * this.scale, 2, 16 * this.scale);
    }
    if (!this.dead) this.drawWeapon(ctx, wp, t);
    if (this.webbed > 0) drawWebWrap(ctx, x, y, this.w * this.scale, this.h, this.id);
    if (this.state === 'windup' && !this.dead && this.webbed <= 0 && Math.floor(t * 16) % 2 === 0) {
      ctx.fillStyle = '#ff5050';
      ctx.fillRect(wp.head[0] - 1, wp.head[1] - 9 * this.scale, 2, 3);
      ctx.fillRect(wp.head[0] - 1, wp.head[1] - 5 * this.scale, 2, 1);
    }
  }

  // Detalles de ropa de los matones (gorras, gafas, cadenas, pañuelos)
  drawOutfit(ctx, wp, t, sc) {
    if (this.dead || this.pal === FLASH_PAL || this.flash > 0) return;
    const [hx, hy] = wp.head, f = this.facing, v = this.id % 4;
    const hs = Math.max(5, Math.round(5 * sc));
    const top = hy - Math.floor(hs / 2);
    if (this.type === 'thug' || this.type === 'bat') {
      if (v === 0) { ctx.fillStyle = shade(this.pal.torso, -0.35); ctx.fillRect(hx - 3, top - 1, 6, 2); ctx.fillRect(hx + f * 2, top, f * 3, 1); } // gorra
      else if (v === 1) { ctx.fillStyle = '#101010'; ctx.fillRect(hx + (f > 0 ? 0 : -2), top + 2, 3, 1); } // gafas de sol
      else if (v === 2) { ctx.fillStyle = '#c02030'; ctx.fillRect(hx - 2, top + 3, 5, 2); } // pañuelo
      else { ctx.fillStyle = '#e0c040'; ctx.fillRect(wp.neck[0] - 1, wp.neck[1] + 1, 3, 1); } // cadena
    } else if (this.type === 'gunner') {
      ctx.fillStyle = '#101010'; ctx.fillRect(hx + (f > 0 ? 0 : -2), top + 2, 3, 1);
    } else if (this.type === 'brute') {
      ctx.fillStyle = '#20242c'; ctx.fillRect(hx - 3, top - 1, 7, 2);
      ctx.fillStyle = shade(this.pal.torso, 0.25); ctx.fillRect(wp.sh[0] - 3, wp.sh[1] - 1, 7, 2);
    } else if (this.type === 'chitauri') {
      ctx.fillStyle = '#c060ff'; ctx.fillRect(hx - 2, top + 2, 5, 1);
      if (Math.floor(t * 4) % 2) { ctx.fillStyle = '#e0a0ff'; ctx.fillRect(wp.mid[0], wp.mid[1], 1, 1); }
    } else if (this.type === 'zombie') {
      ctx.fillStyle = '#5a1a14'; ctx.fillRect(wp.mid[0] - 1, wp.mid[1], 2, 2);
    }
  }

  drawWeapon(ctx, wp, t) {
    const [hx, hy] = wp.h2;
    const f = this.facing;
    if (this.spec.weapon === 'bat') {
      ctx.fillStyle = '#8a5a2a';
      const up = this.state === 'windup';
      if (up) thickLine(ctx, hx, hy, hx - f * 6, hy - 10, 2);
      else thickLine(ctx, hx, hy, hx + f * 11, hy - 2, 2);
    } else if (this.spec.weapon === 'gun') {
      ctx.fillStyle = '#202020'; ctx.fillRect(f > 0 ? hx : hx - 5, hy - 1, 6, 2);
      if (this.state === 'attack' && this.t > 0.12) { ctx.fillStyle = '#ffe060'; ctx.fillRect(f > 0 ? hx + 6 : hx - 8, hy - 2, 3, 3); }
    } else if (this.spec.weapon === 'alien') {
      ctx.fillStyle = '#6a4a8a'; ctx.fillRect(f > 0 ? hx - 1 : hx - 7, hy - 2, 8, 3);
      ctx.fillStyle = this.state === 'windup' ? (Math.floor(t * 20) % 2 ? '#ffffff' : '#e080ff') : '#c060ff';
      ctx.fillRect(f > 0 ? hx + 6 : hx - 8, hy - 1, 2, 2);
    }
    if (this.state === 'windup' && this.spec.kind === 'ranged' && this.spec.proj === 'bullet') {
      ctx.fillStyle = 'rgba(255,40,40,0.5)';
      ctx.fillRect(f > 0 ? hx + 6 : hx - 66, hy, 60, 1);
    }
  }

  drawDrone(ctx, x, y, t) {
    const f = this.flash > 0;
    const body = f ? '#ffffff' : this.type === 'ultron' ? '#a8b0bc' : (this.type === 'decoy' || this.mysterio ? '#4a6a5a' : '#5a606c');
    const bx = x - 6, by = Math.round(y);
    ctx.fillStyle = '#140a12'; ctx.fillRect(bx - 1, by + 1, 14, 7);
    ctx.fillStyle = body; ctx.fillRect(bx, by + 2, 12, 5);
    ctx.fillStyle = shade(body, 0.3); ctx.fillRect(bx + 1, by + 2, 10, 1);
    const blink = Math.floor(t * 30) % 2;
    ctx.fillStyle = '#9aa0a8';
    ctx.fillRect(bx - 3 + (blink ? 0 : 1), by, 6, 1); ctx.fillRect(bx + 9 + (blink ? 1 : 0), by, 6, 1);
    ctx.fillRect(bx, by + 1, 1, 1); ctx.fillRect(bx + 11, by + 1, 1, 1);
    const eye = this.state === 'windup' ? (blink ? '#ffffff' : '#ff3030') : (this.mysterio || this.type === 'decoy' ? '#60ff90' : '#ff5050');
    ctx.fillStyle = eye; ctx.fillRect(bx + 5 + this.facing, by + 4, 2, 2);
    if (this.webbed > 0) drawWebWrap(ctx, x, by + 8, 12, 8, this.id);
  }
}

function drawWebWrap(ctx, x, y, w, h, seed) {
  ctx.fillStyle = 'rgba(240,240,240,0.9)';
  for (let i = 0; i < 6; i++) {
    const a = hash2(seed, i), b = hash2(i, seed);
    const x0 = x - w / 2 - 2 + a * (w + 4), y0 = y - h + b * h;
    thickLine(ctx, x0, y0, x0 + (b - 0.5) * w, y0 + (a - 0.5) * 8, 1);
  }
}

// ---------------------------------------------------------------------------
// Jefes
// ---------------------------------------------------------------------------
class Boss extends Enemy {
  constructor(type, x, y, o) {
    super('thug', x, y);
    this.type = type; this.isBoss = true;
    this.name = o.name; this.w = o.w; this.h = o.h; this.scale = o.scale || 1;
    this.hp = this.maxHp = Math.ceil(o.hp * DIFF_HP[Game.settings.difficulty]);
    this.baseDmg = o.dmg; this.pal = o.pal;
    this.phase = 1; this.stun = 0; this.webHits = 0; this.webNeed = (o.webNeed || 3) + 1 + (Game.settings.difficulty === 2 ? 1 : 0); this.streak = 0; this.lastHitT = -9;
    this.state = 'wait'; this.t = 0; this.inv = 0; this.armorMul = o.armor || 1;
    this.spec = { kind: 'boss', tech: 0, dmg: o.dmg };
    this.contactDmg = false;
    this.facing = -1;
  }
  hurtbox() { return { x: this.x - 2, y: this.y, w: this.w + 4, h: this.h }; }
  hittable() { return !this.dead && this.state !== 'wait' && this.inv <= 0; }
  bdmg(m = 1) { return Math.round(this.baseDmg * m * DIFF_DMG[Game.settings.difficulty]); }
  speedMul() { return BOSS_SPEED[this.phase] * (Game.settings.difficulty === 0 ? 0.85 : 1); }

  takeHit(dmg, kx, ky, heavy, world) {
    if (!this.hittable()) return false;
    // castiga el machaque de botones: tras varios golpes seguidos, contraataca
    this.streak = this.anim - this.lastHitT < 0.9 ? this.streak + 1 : 1;
    this.lastHitT = this.anim;
    const limit = [8, 6, 4][Game.settings.difficulty];
    if (this.streak >= limit && this.stun <= 0 && !this.dead) {
      this.streak = 0;
      this.counter(world);
      return false;
    }
    const mul = this.stun > 0 ? 1.5 : Math.min(this.armorMul, 0.85);
    this.hp -= dmg * mul;
    this.flash = 0.1;
    if (this.stun > 0) this.vx = kx * 0.25;
    if (this.escapeAt && this.hp <= this.maxHp * this.escapeAt) {
      this.hp = Math.max(1, this.hp); this.escaped = true;
      world.particles.burst(this.cx, this.cy, 24, '#e06020', 120); world.particles.burst(this.cx, this.cy, 16, '#60ffe0', 90);
      this.die(kx, world); return true;
    }
    if (this.hp <= 0) { this.hp = 0; this.die(kx, world); return true; }
    if (this.phase === 1 && this.hp <= this.maxHp / 2) {
      this.phase = 2; this.inv = 0.8; this.stun = 0;
      this.state = 'roar'; this.t = 1.0;
      Audio2.sfx('roar'); world.shake(6);
      this.onPhase2(world);
    } else if (this.phase === 2 && this.hp <= this.maxHp / 4) {
      // fase 3: furia
      this.phase = 3; this.inv = 0.8; this.stun = 0;
      this.state = 'roar'; this.t = 0.8;
      Audio2.sfx('roar'); world.shake(8);
      world.float('¡FURIA!', this.cx, this.y - 14, '#ff4040');
      if (this.arena && !this.noMinions) {
        const type = ENEMY_THEME === 'zombie' ? 'zombie' : 'thug';
        for (let i = 0; i < 2; i++) world.spawnMinion(type, this.arena);
      }
    }
    return true;
  }
  counter(world) {
    const p = world.player;
    this.inv = 0.35; this.state = 'recover'; this.t = 0.3; this.vx = 0;
    world.float('¡CONTRAATAQUE!', this.cx, this.y - 12, '#ff6060');
    world.particles.burst(this.cx, this.cy, 24, '#ff8040', 160);
    world.shake(5); Audio2.sfx('explode');
    if (dist(p.cx, p.cy, this.cx, this.cy) < 60) {
      if (world.damagePlayer(this.bdmg(0.7), this.cx, this.z)) { p.vx = sign(p.cx - this.cx || 1) * 260; p.vy = -220; }
    }
  }
  onPhase2() {}
  web(dur, world) {
    if (this.dead || this.state === 'wait' || this.stun > 0) return;
    this.webHits++;
    world.particles.burst(this.cx, this.cy, 6, '#ffffff', 60);
    if (this.webHits >= this.webNeed) {
      this.webHits = 0;
      this.stun = 1.8; this.state = 'stunned'; this.t = 1.8;
      world.float('¡ATURDIDO!', this.cx, this.y - 10, '#ffe060');
      Audio2.sfx('webhit');
      this.onStun(world);
    } else {
      world.float('RED ' + this.webHits + '/' + this.webNeed, this.cx, this.y - 10, '#ffffff');
    }
  }
  onStun() {}
  die(kx, world) {
    this.dead = true; this.state = 'ko'; this.koT = 99; this.vx = kx * 0.5; this.vy = -200; this.fly = false;
    Audio2.sfx('explode'); world.shake(8);
    world.onBossKO(this);
  }
  common(dt, world) {
    this.anim += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.inv > 0) this.inv -= dt;
    if (this.stun > 0) this.stun -= dt;
  }
  update(dt, world) {
    this.common(dt, world);
    if (this.dead) {
      this.vy = Math.min(this.vy + GRAV * dt, 400);
      if (this.onGround) this.vx = approach(this.vx, 0, 400 * dt);
      world.level.move(this, dt);
      return;
    }
    if (this.state === 'wait') { this.vy = Math.min(this.vy + GRAV * dt, 400); world.level.move(this, dt); return; }
    if (this.state === 'roar') {
      this.t -= dt; this.vx = 0;
      this.vy = Math.min(this.vy + GRAV * dt, 400); world.level.move(this, dt);
      if (this.t <= 0) { this.state = 'move'; this.t = 0.5; }
      return;
    }
    if (this.state === 'stunned') {
      this.t -= dt;
      this.vx = approach(this.vx, 0, 400 * dt);
      this.vy = Math.min(this.vy + GRAV * dt, 400); world.level.move(this, dt);
      if (Math.floor(this.anim * 10) % 4 === 0) world.particles.spark(this.cx + rand(-6, 6), this.y - 4, '#ffe060', 1);
      if (this.t <= 0) { this.state = 'move'; this.t = 0.6; this.stun = 0; }
      this.clampArena();
      return;
    }
    this.updZ(dt, world.player, 28 * this.speedMul());
    if (this.state === 'recover') this.t -= dt * 0.35 * this.phase;
    this.ai(dt, world);
    this.clampArena();
    // daño por contacto en embestidas
    if (this.contactDmg && overlap(this.hurtbox(), world.player.hurtbox())) world.damagePlayer(this.bdmg(), this.cx, this.z);
  }
  ground(dt, world) {
    this.vy = Math.min(this.vy + GRAV * dt, 450);
    world.level.move(this, dt);
  }
  faceP(world) { this.facing = world.player.cx >= this.cx ? 1 : -1; }
  drawStun(ctx, x, y, t) {
    if (this.state !== 'stunned') return;
    for (let i = 0; i < 3; i++) {
      const a = t * 4 + i * TAU / 3;
      ctx.fillStyle = '#ffe060';
      ctx.fillRect(Math.round(x + Math.cos(a) * 8), Math.round(y + Math.sin(a) * 3), 2, 2);
    }
  }
  drawHP() {}
}

// ---- Jefe 1: Shocker ----
class Shocker extends Boss {
  constructor(x, y) {
    super('shocker', x, y, { name: 'SHOCKER', w: 12, h: 25, scale: 1.1, hp: 42, dmg: 12,
      pal: makePal({ head: '#d8b830', hair: '#6a5a20', torso: '#d8b830', torsoLow: '#8a7020', arm: '#8a7020', arm2: '#d8b830', hand: '#5a6a80', leg: '#6a5a30', boot: '#3a2a1a', face: 'goggles', eye: '#60c0ff', outline: '#140a12' }) });
  }
  ai(dt, world) {
    const p = world.player, adx = Math.abs(p.cx - this.cx);
    this.contactDmg = this.state === 'dash';
    switch (this.state) {
      case 'move': {
        this.faceP(world);
        this.t -= dt;
        let want = 0;
        if (adx < 80) want = -this.facing; else if (adx > 140) want = this.facing;
        this.vx = approach(this.vx, want * 60 * this.speedMul(), 400 * dt);
        if (this.t <= 0) {
          const r = Math.random();
          if (adx < 90 && r < 0.5) { this.state = 'dashWU'; this.t = 0.45; }
          else if (r < 0.75) { this.state = 'blastWU'; this.t = 0.6; }
          else { this.state = 'waveWU'; this.t = 0.7; this.slams = this.phase >= 2 ? 2 : 1; }
          Audio2.sfx('zap');
        }
        break;
      }
      case 'blastWU':
        this.faceP(world); this.vx = approach(this.vx, 0, 600 * dt); this.t -= dt;
        if (this.t <= 0) {
          const angs = this.phase >= 2 ? [-14, 0, 14] : [0];
          const ox = this.cx + this.facing * 10, oy = this.y + 10;
          const base = Math.atan2(p.cy - oy, p.cx - ox);
          for (const a of angs) {
            const r = base + a * D2R;
            world.addProj(new Proj('shock', ox, oy, Math.cos(r) * 175, Math.sin(r) * 175, 'e', this.bdmg()));
          }
          Audio2.sfx('zap'); world.shake(2);
          this.state = 'recover'; this.t = 0.8;
        }
        break;
      case 'waveWU':
        this.vx = approach(this.vx, 0, 600 * dt); this.t -= dt;
        if (this.t <= 0) {
          for (const d of [-1, 1]) world.addProj(new Proj('wave', this.cx + d * 8, this.y + this.h - 6, d * 190, 0, 'e', this.bdmg(0.9)));
          world.shake(4); Audio2.sfx('heavy');
          this.slams--;
          if (this.slams > 0) this.t = 0.5; else { this.state = 'recover'; this.t = 0.9; }
        }
        break;
      case 'dashWU':
        this.faceP(world); this.vx = 0; this.t -= dt;
        if (this.t <= 0) { this.state = 'dash'; this.t = 0.5; this.vx = this.facing * 280 * this.speedMul(); Audio2.sfx('whoosh'); }
        break;
      case 'dash':
        this.t -= dt;
        if (Math.floor(this.anim * 30) % 2) world.particles.spark(this.cx, this.cy, '#80d0ff', 1);
        if (this.t <= 0 || this.hitWall) { this.state = 'recover'; this.t = 0.8; }
        break;
      case 'recover':
        this.vx = approach(this.vx, 0, 500 * dt); this.t -= dt;
        if (this.t <= 0) { this.state = 'move'; this.t = rand(0.8, 1.4) / this.speedMul(); }
        break;
      default: this.state = 'move';
    }
    this.ground(dt, world);
  }
  draw(ctx, cam, t) {
    const x = Math.round(this.cx - cam.x), y = Math.round(this.y + this.h - cam.y);
    let pose;
    if (this.dead) pose = Poses.ko();
    else switch (this.state) {
      case 'blastWU': pose = Poses.aim(); break;
      case 'waveWU': pose = Poses.cheer(t); pose.a1 = 170; pose.b1 = 160; break;
      case 'dash': case 'dashWU': pose = Poses.punch1(); break;
      case 'stunned': pose = Poses.hurt(); break;
      case 'roar': pose = Poses.cheer(t); break;
      default: pose = Math.abs(this.vx) > 8 ? Poses.run(this.anim * 8) : Poses.idle(t);
    }
    const glow = this.state.endsWith('WU') && Math.floor(t * 20) % 2;
    const wp = Rig.draw(ctx, x, y, this.facing, pose, this.flash > 0 ? FLASH_PAL : this.pal, { scale: this.scale });
    for (const h of [wp.h1, wp.h2]) {
      ctx.fillStyle = '#3a4a60'; ctx.fillRect(h[0] - 3, h[1] - 3, 6, 6);
      ctx.fillStyle = glow ? '#ffffff' : '#60c0ff'; ctx.fillRect(h[0] - 1, h[1] - 1, 3, 3);
    }
    this.drawStun(ctx, wp.head[0], wp.head[1] - 8, t);
  }
}

// ---- Jefe 2: Exo-Matón ----
class ExoBrute extends Boss {
  constructor(x, y) {
    super('exo', x, y, { name: 'EXO-MATÓN', w: 18, h: 38, scale: 1.7, hp: 60, dmg: 15, armor: 0.5,
